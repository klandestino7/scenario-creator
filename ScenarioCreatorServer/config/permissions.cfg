####################################
#       WEAPON LOADOUTS MENU       #
####################################
add_ace builtin.everyone "ScenarioCreator.WeaponLoadouts.Menu" allow
add_ace builtin.everyone "ScenarioCreator.WeaponLoadouts.All" allow
# add_ace builtin.everyone "ScenarioCreator.WeaponLoadouts.Equip" allow
# add_ace builtin.everyone "ScenarioCreator.WeaponLoadouts.EquipOnRespawn" allow

####################################
#        MISC SETTINGS MENU        #
####################################
# There is no ScenarioCreator.MiscSettings.Menu permission on purpose, some options in the misc settings menu
# should *ALWAYS* be allowed, so you can't restrict the opening of this menu!
#add_ace builtin.everyone "ScenarioCreator.MiscSettings.All" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.ClearArea" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.TeleportToWp" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.TeleportToCoord" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.ShowCoordinates" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.ShowLocation" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.JoinQuitNotifs" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.DeathNotifs" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.NightVision" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.ThermalVision" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.LocationBlips" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.OverheadNames" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.PlayerBlips" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.TeleportLocations" allow
add_ace group.moderator "ScenarioCreator.MiscSettings.TeleportSaveLocation" allow # Only allowed for moderators by default
add_ace builtin.everyone "ScenarioCreator.MiscSettings.ConnectionMenu" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.RestoreAppearance" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.RestoreWeapons" allow
add_ace builtin.everyone "ScenarioCreator.MiscSettings.DriftMode" allow
add_ace group.moderator "ScenarioCreator.MiscSettings.EntitySpawner" allow # Probably not the best idea to give this feature for everyone
add_ace group.developer "ScenarioCreator.MiscSettings.DevTools" allow # Probably not the best idea to give this feature for everyone

####################################
#     VOICE CHAT OPTIONS MENU      #
####################################
# To disable ScenarioCreator's voice chat options, simply remove this section completely and ScenarioCreator won't touch voice chat at all.
add_ace builtin.everyone "ScenarioCreator.VoiceChat.Menu" allow
#add_ace builtin.everyone "ScenarioCreator.VoiceChat.All" allow
add_ace builtin.everyone "ScenarioCreator.VoiceChat.Enable" allow
add_ace builtin.everyone "ScenarioCreator.VoiceChat.ShowSpeaker" allow
setr ScenarioCreator_override_voicechat_default_range 0.0 # range in meters, 0.0 is user default


# Staff voice channel is restricted to moderators/admins by default.
add_ace group.moderator "ScenarioCreator.VoiceChat.StaffChannel" allow
